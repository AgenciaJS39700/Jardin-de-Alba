# Descarga las imágenes de img/fuentes.txt y las pasa a WebP (normal 1400 px + móvil 720 px).
name: Imágenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["img/fuentes.txt", ".github/workflows/imagenes.yml"]
permissions:
  contents: write
jobs:
  imagenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
      - name: Descargar y convertir
        run: |
          mkdir -p /tmp/raw
          grep -v '^#' img/fuentes.txt | while read -r n u; do
            [ -z "$n" ] && continue
            curl -sSfL -o "/tmp/raw/$n.png" "$u"
            w=1400; case "$n" in banda|equipo|evento|clinica) w=2000;; esac
            convert "/tmp/raw/$n.png" -resize "${w}x${w}>" -strip "/tmp/raw/$n-big.png"
            cwebp -quiet -q 78 -m 6 "/tmp/raw/$n-big.png" -o "img/$n.webp"
            convert "/tmp/raw/$n.png" -resize "720x720>" -strip "/tmp/raw/$n-m.png"
            cwebp -quiet -q 74 -m 6 "/tmp/raw/$n-m.png" -o "img/$n-m.webp"
          done
          ls -la img
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "chore(img): imágenes WebP"
          git push
